<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration – Station 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; font-family: system-ui, sans-serif; }

    .station-badge {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 20px;
      background: #1a6bb0; color: #fff;
    }

    .section-card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); border: none; }

    /* Patient info – green tint */
    .patient-card { border-left: 4px solid #28a745 !important; }
    .patient-card .card-header { background: #e8f5e9; color: #1d5c2e; border-bottom: 1px solid #c3e6cb; border-radius: 11px 11px 0 0; }

    /* Persistent clinic fields – amber tint */
    .clinic-card { border-left: 4px solid #ffc107 !important; }
    .clinic-card .card-header { background: #fff8e1; color: #7a5900; border-bottom: 1px solid #ffe082; border-radius: 11px 11px 0 0; }

    .section-label {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: inherit;
    }
    .persist-note { font-size: 0.78rem; font-weight: 400; color: #888; }

    .form-label { font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 3px; }
    .form-control, .form-select { font-size: 0.95rem; }

    .btn-next {
      background: #1a6bb0; border-color: #1a6bb0; color: #fff;
      font-size: 1rem; padding: 10px 36px; border-radius: 8px;
    }
    .btn-next:hover { background: #155a99; }

    textarea.form-control { resize: vertical; min-height: 60px; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width:900px">

  <!-- Header -->
  <div class="d-flex align-items-center mb-4 gap-3">
    <div>
      <h4 class="mb-0 fw-bold">Patient Registration</h4>
      <small class="text-muted">Fill in patient details then click Save &amp; Continue</small>
    </div>
    <span class="station-badge ms-auto">STATION 1</span>
  </div>

  <form method="POST" action="/save-registration" id="regForm" novalidate>

    <!-- ── Patient Information (from MRZ passport scan) ─────────────────── -->
    <div class="card section-card patient-card mb-4">
      <div class="card-header px-4 py-3">
        <span class="section-label">Patient Information</span>
        <span class="ms-2 persist-note">pre-filled from passport scan – please verify</span>
      </div>
      <div class="card-body px-4 pt-3 pb-4">
        <div class="row g-3">

          <div class="col-md-8">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" name="name"
                   value="{{ mrz.name }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender">
              <option value="Male"   {% if mrz.gender == 'Male'   %}selected{% endif %}>Male</option>
              <option value="Female" {% if mrz.gender == 'Female' %}selected{% endif %}>Female</option>
              <option value="Other"  {% if mrz.gender == 'Other'  %}selected{% endif %}>Other</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Surname</label>
            <input type="text" class="form-control" name="surname"
                   value="{{ mrz.surname }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Given Names</label>
            <input type="text" class="form-control" name="given_names"
                   value="{{ mrz.given_names }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Nationality</label>
            <input type="text" class="form-control" name="nationality"
                   value="{{ mrz.nationality }}" placeholder="e.g. SGP">
          </div>

          <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
            <input type="text" class="form-control" name="dob"
                   value="{{ mrz.dob }}" placeholder="DD/MM/YYYY">
          </div>
          <div class="col-md-4">
            <label class="form-label">Passport Number *</label>
            <input type="text" class="form-control" name="passport_number"
                   value="{{ mrz.passport_number }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Passport Expiry</label>
            <input type="text" class="form-control" name="expiry"
                   value="{{ mrz.expiry }}" placeholder="DD/MM/YYYY">
          </div>

        </div>
      </div>
    </div>

    <!-- ── Clinic / Job Details (persistent across patients) ─────────────── -->
    <div class="card section-card clinic-card mb-4">
      <div class="card-header px-4 py-3">
        <span class="section-label">Clinic &amp; Job Details</span>
        <span class="ms-2 persist-note">
          &#128190; remembered between patients – update only when needed
        </span>
      </div>
      <div class="card-body px-4 pt-3 pb-4">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Corporation Name</label>
            <input type="text" class="form-control persistent"
                   name="corporation" id="corporation"
                   placeholder="e.g. ABC Construction Pte Ltd">
          </div>

          <div class="col-md-6">
            <label class="form-label">Tests Required</label>
            <textarea class="form-control persistent"
                      name="tests_required" id="tests_required"
                      placeholder="e.g. Full Blood Count, Chest X-Ray, Lung Function"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">Vaccine Required</label>
            <textarea class="form-control persistent"
                      name="vaccine_required" id="vaccine_required"
                      placeholder="e.g. Hepatitis B, Tetanus Toxoid"></textarea>
          </div>

          <div class="col-md-3">
            <label class="form-label">Doctor Name</label>
            <input type="text" class="form-control persistent"
                   name="doctor_name" id="doctor_name"
                   placeholder="Dr. Tan Ah Kow">
          </div>

          <div class="col-md-3">
            <label class="form-label">Doctor MCR</label>
            <input type="text" class="form-control persistent"
                   name="doctor_mcr" id="doctor_mcr"
                   placeholder="M12345A">
          </div>

        </div>
      </div>
    </div>

    <!-- ── Actions ───────────────────────────────────────────────────────── -->
    <div class="d-flex gap-3 align-items-center">
      <button type="submit" class="btn btn-next" id="submitBtn">
        Save &amp; Capture Signature →
      </button>
      <a href="/register" class="btn btn-outline-secondary">
        ✕ Clear / New Patient
      </a>
    </div>

  </form>
</div>

<script>
// ── Persistent clinic fields via localStorage ────────────────────────────────
const PERSIST_FIELDS = [
  'corporation', 'tests_required', 'vaccine_required',
  'doctor_name', 'doctor_mcr'
];

// Restore saved values on load
PERSIST_FIELDS.forEach(id => {
  const saved = localStorage.getItem('persist_' + id);
  if (saved !== null && saved !== '') {
    const el = document.getElementById(id);
    if (el) el.value = saved;
  }
});

// Save values whenever they change (so they persist even if the page is closed)
PERSIST_FIELDS.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => {
    localStorage.setItem('persist_' + id, el.value);
  });
});

// Also save on submit (belt-and-suspenders)
document.getElementById('regForm').addEventListener('submit', () => {
  PERSIST_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) localStorage.setItem('persist_' + id, el.value);
  });
});
// ────────────────────────────────────────────────────────────────────────────
</script>
</body>
</html>
