<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station 2 - Height &amp; Weight</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Station 2: Height &amp; Weight</h1>

        <div id="status" class="status hidden"></div>

        <!-- ── Step 1: QR Scan ──────────────────────────────────── -->
        <div id="scanSection">
            <h2>Scan Patient QR Code</h2>
            <p class="hint">Point the QR scanner at the patient's label and scan.</p>
            <div class="form-group">
                <label for="qrInput">QR Scanner Input</label>
                <input
                    type="text"
                    id="qrInput"
                    placeholder="Scan QR code here..."
                    autocomplete="off"
                    autofocus
                >
            </div>
        </div>

        <!-- ── Step 2: Patient Info + Measurements ──────────────── -->
        <div id="dataSection" class="hidden">
            <h2>Patient Details</h2>
            <div class="patient-card">
                <div class="patient-field">
                    <span class="label">Name</span>
                    <span id="displayName" class="value"></span>
                </div>
                <div class="patient-field">
                    <span class="label">Passport No.</span>
                    <span id="displayPassport" class="value"></span>
                </div>
            </div>

            <h2>Measurements</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input
                        type="number"
                        id="height"
                        name="height"
                        placeholder="e.g. 170"
                        min="50"
                        max="250"
                        step="0.1"
                    >
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        placeholder="e.g. 65"
                        min="10"
                        max="300"
                        step="0.1"
                    >
                </div>
            </div>

            <div class="button-row">
                <button id="saveBtn" class="btn-save" onclick="saveData()">Save</button>
                <button class="btn-secondary" onclick="resetForm()">Scan Next Patient</button>
            </div>
        </div>
    </div>

    <script>
        let currentPassport = "";
        let currentName = "";

        const qrInput = document.getElementById("qrInput");
        const scanSection = document.getElementById("scanSection");
        const dataSection = document.getElementById("dataSection");

        // ── QR scan handler ───────────────────────────────────────
        // USB QR scanners type the content then press Enter.
        qrInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const raw = qrInput.value.trim();
                if (raw) parseQr(raw);
            }
        });

        // Also handle if the scanner sends data all at once (some models)
        qrInput.addEventListener("change", () => {
            const raw = qrInput.value.trim();
            if (raw) parseQr(raw);
        });

        function parseQr(raw) {
            // QR format: "Name|PassportNumber"
            const parts = raw.split("|");
            if (parts.length < 2) {
                showStatus("Could not read QR code. Please try again.", "error");
                qrInput.value = "";
                return;
            }
            currentName = parts[0].trim();
            currentPassport = parts[1].trim();

            document.getElementById("displayName").textContent = currentName;
            document.getElementById("displayPassport").textContent = currentPassport;

            // Switch to data entry view
            scanSection.classList.add("hidden");
            dataSection.classList.remove("hidden");

            // Focus height field
            document.getElementById("height").focus();
        }

        // ── Save data ─────────────────────────────────────────────
        async function saveData() {
            const height = document.getElementById("height").value.trim();
            const weight = document.getElementById("weight").value.trim();

            if (!height && !weight) {
                showStatus("Please enter at least one measurement.", "error");
                return;
            }

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const resp = await fetch("/api/station2/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        passport_number: currentPassport,
                        name: currentName,
                        height: height,
                        weight: weight,
                    }),
                });

                const result = await resp.json();
                if (!resp.ok) throw new Error(result.error || "Save failed");

                showStatus(`Saved for ${currentName} (${currentPassport})`, "success");
                setTimeout(resetForm, 1500);

            } catch (err) {
                showStatus("Error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Save";
            }
        }

        // ── Reset for next patient ────────────────────────────────
        function resetForm() {
            currentName = "";
            currentPassport = "";
            document.getElementById("height").value = "";
            document.getElementById("weight").value = "";
            qrInput.value = "";
            dataSection.classList.add("hidden");
            scanSection.classList.remove("hidden");
            qrInput.focus();
        }

        function showStatus(msg, type) {
            const el = document.getElementById("status");
            el.textContent = msg;
            el.className = "status " + type;
            el.classList.remove("hidden");
            setTimeout(() => el.classList.add("hidden"), 6000);
        }

        // Auto-focus scan field whenever scan section is visible
        qrInput.focus();
    </script>
</body>
</html>
