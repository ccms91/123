<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station 2 - Height &amp; Weight</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- jsQR: reads QR codes from camera frames, no installation needed -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="/static/qr_scanner.js"></script>
</head>
<body>
    <div class="container">
        <h1>Station 2: Height &amp; Weight</h1>

        <div id="status" class="status hidden"></div>

        <!-- ── Step 1: Scan ────────────────────────────────────── -->
        <div id="scanSection">
            <h2>Scan Patient QR Code</h2>

            <!-- Primary: camera button (Android / any phone) -->
            <button class="btn-scan" onclick="startCamera()">
                📷 Tap to Scan QR Code
            </button>

            <!-- Fallback: type / paste / USB scanner -->
            <details class="manual-entry">
                <summary>Manual entry / USB scanner</summary>
                <div class="form-group" style="margin-top:12px">
                    <input
                        type="text"
                        id="qrInput"
                        placeholder="Scan or type QR data, then press Enter"
                        autocomplete="off"
                    >
                </div>
            </details>
        </div>

        <!-- ── Step 2: Patient info + measurements ──────────────── -->
        <div id="dataSection" class="hidden">
            <div class="patient-card">
                <div class="patient-field">
                    <span class="label">Name</span>
                    <span id="displayName" class="value"></span>
                </div>
                <div class="patient-field">
                    <span class="label">Passport No.</span>
                    <span id="displayPassport" class="value"></span>
                </div>
            </div>

            <h2>Measurements</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input
                        type="number"
                        id="height"
                        placeholder="e.g. 170"
                        min="50" max="250" step="0.1"
                        inputmode="decimal"
                    >
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input
                        type="number"
                        id="weight"
                        placeholder="e.g. 65"
                        min="10" max="300" step="0.1"
                        inputmode="decimal"
                    >
                </div>
            </div>

            <div class="button-row">
                <button id="saveBtn" class="btn-save" onclick="saveData()">Save</button>
                <button class="btn-secondary" onclick="resetForm()">← Scan Next Patient</button>
            </div>
        </div>
    </div>

    <script>
        let currentPassport = "";
        let currentName = "";

        // ── Camera scan ───────────────────────────────────────────
        async function startCamera() {
            try {
                await QRScanner.start(onQrDetected);
            } catch (err) {
                showStatus(err.message, "error");
            }
        }

        function onQrDetected(raw) {
            parseQr(raw);
        }

        // ── USB / manual fallback ─────────────────────────────────
        const qrInput = document.getElementById("qrInput");
        qrInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); parseQr(qrInput.value.trim()); }
        });
        qrInput.addEventListener("change", () => parseQr(qrInput.value.trim()));

        // ── QR parser ─────────────────────────────────────────────
        // Labels 1-4 QR format: "Name|PassportNumber"
        function parseQr(raw) {
            if (!raw) return;
            const parts = raw.split("|");
            if (parts.length < 2) {
                showStatus("QR not recognised. Please try again.", "error");
                qrInput.value = "";
                return;
            }
            currentName = parts[0].trim();
            currentPassport = parts[1].trim();

            document.getElementById("displayName").textContent = currentName;
            document.getElementById("displayPassport").textContent = currentPassport;

            document.getElementById("scanSection").classList.add("hidden");
            document.getElementById("dataSection").classList.remove("hidden");
            document.getElementById("height").focus();
        }

        // ── Save ──────────────────────────────────────────────────
        async function saveData() {
            const height = document.getElementById("height").value.trim();
            const weight = document.getElementById("weight").value.trim();

            if (!height && !weight) {
                showStatus("Please enter at least one measurement.", "error");
                return;
            }

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const resp = await fetch("/api/station2/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        passport_number: currentPassport,
                        name: currentName,
                        height,
                        weight,
                    }),
                });
                const result = await resp.json();
                if (!resp.ok) throw new Error(result.error || "Save failed");

                showStatus(`Saved for ${currentName}`, "success");
                setTimeout(resetForm, 1500);
            } catch (err) {
                showStatus("Error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Save";
            }
        }

        // ── Reset ─────────────────────────────────────────────────
        function resetForm() {
            currentName = "";
            currentPassport = "";
            document.getElementById("height").value = "";
            document.getElementById("weight").value = "";
            qrInput.value = "";
            document.getElementById("dataSection").classList.add("hidden");
            document.getElementById("scanSection").classList.remove("hidden");
        }

        function showStatus(msg, type) {
            const el = document.getElementById("status");
            el.textContent = msg;
            el.className = "status " + type;
            el.classList.remove("hidden");
            setTimeout(() => el.classList.add("hidden"), 7000);
        }
    </script>
</body>
</html>
